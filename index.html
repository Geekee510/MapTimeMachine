<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界历史动态地图 · MVP</title>
  </head>
  <body>
    <div id="map"></div>

    <!-- 年份大字 -->
    <div id="year-display">1960</div>

    <!-- 世界/中国 模式切换 -->
    <div id="mode-switch">
      <button id="mode-world" class="active" type="button">世界地图</button>
      <button id="mode-china" type="button">中国疆域</button>
      <button id="mode-chinahist" type="button">中国历史</button>
    </div>

    <!-- 加载提示 -->
    <div id="loading">正在加载历史疆域数据（CShapes 1886–2023）…</div>

    <!-- 信息卡 -->
    <div id="info" class="hidden">
      <button id="info-close">×</button>
      <h3 id="info-name"></h3>
      <div id="info-body"></div>
      <div id="info-events" class="hidden"></div>
    </div>

    <!-- 图例 -->
    <div id="legend">
      <div class="legend-title">政权类型</div>
      <div class="legend-row"><span class="sw" style="background:rgb(150,190,140)"></span>独立国家</div>
      <div class="legend-row"><span class="sw" style="background:rgb(230,200,130)"></span>殖民地</div>
      <div class="legend-row"><span class="sw" style="background:rgb(225,160,90)"></span>保护国</div>
      <div class="legend-row"><span class="sw" style="background:rgb(190,130,180)"></span>托管地</div>
      <div class="legend-row"><span class="sw" style="background:rgb(200,70,70)"></span>被占领土</div>
    </div>

    <!-- 右侧图层面板 -->
    <div id="panel">
      <div class="panel-title">图层</div>
      <!-- 公共图层：世界地图 / 中国疆域 两种模式都生效 -->
      <label><input type="checkbox" id="toggle-territory" checked /> 历史疆域</label>
      <label><input type="checkbox" id="toggle-river" checked /> 主要河流</label>
      <label><input type="checkbox" id="toggle-river-label" checked /> 河流名称</label>
      <label><input type="checkbox" id="toggle-mountain" checked /> 山脉名称</label>
      <label><input type="checkbox" id="toggle-relief" /> 地形晕渲（山脉形势）</label>
      <label><input type="checkbox" id="toggle-lake" /> 湖泊</label>
      <label><input type="checkbox" id="toggle-basemap" /> 今地图（含小岛）</label>
      <label><input type="checkbox" id="toggle-zh" checked /> 中文标签</label>
      <!-- 分隔线以下：仅「中国疆域」模式可用的专属图层（世界模式下整块隐藏） -->
      <div id="group-china">
        <div class="panel-divider"></div>
        <label id="row-outline"><input type="checkbox" id="toggle-outline" checked /> 史实边界参考线</label>
        <label id="row-region"><input type="checkbox" id="toggle-region" checked /> 历代政区界（州/府）</label>
      </div>
      <div id="group-chinahist" style="display:none">
        <div class="panel-divider"></div>
        <label id="row-polity"><input type="checkbox" id="toggle-polity" checked /> 政权疆域</label>
        <label id="row-pass"><input type="checkbox" id="toggle-pass" /> 关隘</label>
        <label id="row-city"><input type="checkbox" id="toggle-city" /> 城市</label>
        <label id="row-war"><input type="checkbox" id="toggle-war" /> 战争（军队演进）</label>
        <label id="row-province"><input type="checkbox" id="toggle-province" checked /> 当代省界（参考线）</label>
        <button id="btn-war-list" type="button">⚔ 战争列表</button>
      </div>
      <button id="reset-view">复位视图</button>
      <div class="panel-note">底图：MapLibre demotiles（含陆地/水域/国界）<br/>疆域：CShapes 2.1（CC BY-NC-SA）<br/>河流/山脉/湖泊：Natural Earth（公共领域，需先运行 <code>npm run fetch-data</code>）</div>
    </div>

    <!-- 底部时间轴 -->
    <div id="timeline">
      <button id="play-btn">▶ 播放</button>
      <button id="step-back" title="后退当前粒度一步">◀</button>
      <input type="range" id="year-slider" min="1886" max="2023" value="1960" step="1" />
      <button id="step-fwd" title="前进当前粒度一步">▶</button>
      <select id="speed-select">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="5" selected>5×</option>
        <option value="10">10×</option>
      </select>
      <span id="year-readout">1960</span>
    </div>

    <!-- 世界大事浮层（点击时间轴年份读数时弹出） -->
    <div id="world-events" class="hidden"></div>

    <!-- 战争列表页（第三幅图：选中某场战争 → 跳转并单独回放军队演进） -->
    <div id="war-list" class="hidden">
      <div class="wl-head">
        <span class="wl-title">⚔ 历代战争 · 点击回放</span>
        <button id="war-list-close" type="button">×</button>
      </div>
      <div id="war-list-body"></div>
      <div class="wl-foot">选中后自动跳到该年、开启战争层并单独播放该场战争</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
